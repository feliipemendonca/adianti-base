services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adianti_app
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    environment:
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    networks:
      - adianti_net
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: adianti_db
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-adianti}
      MYSQL_USER: ${MYSQL_USER:-adianti}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-adianti}
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - adianti_net
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: adianti_phpmyadmin
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-adianti}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-adianti}
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - adianti_net
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  adianti_net:
    driver: bridge
