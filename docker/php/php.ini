date.timezone = America/Sao_Paulo
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
display_errors = On
log_errors = On
error_reporting = E_ALL
output_buffering = 4096
session.use_only_cookies = 1
session.cookie_httponly = 1
request_order = GP
variables_order = GPCS
opcache.enable = 1
